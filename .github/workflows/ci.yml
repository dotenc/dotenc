name: CI

on:
  pull_request:
    branches:
      - main
      - beta

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js for the diff action runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Validate README demos
        run: bun run readme:demos:check

      - name: Validate GitHub Action scripts
        run: >-
          bash -n
          actions/_lib/*.sh
          scripts/check-diff-action-bundle.sh
          scripts/sync-action-wrappers.sh
          scripts/alpine-package-tool.sh
          scripts/verify-packages-edge.sh

      - name: Validate website
        run: |
          sh -n website/public/install.sh
          shellcheck -s sh website/public/install.sh
          bun run --cwd website test

      - name: Test redacted diff action
        run: bun run actions:test-diff

      - name: Verify redacted diff action bundle
        run: bun run actions:check-diff-bundle

      - name: Test Linux package publisher safety checks
        run: bun run packages:test-publisher && bun run packages:typecheck-publisher

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Run coverage tests
        run: bun run test:coverage

      - name: Upload CLI coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cli/coverage/lcov.info
          flags: cli
          name: cli-unit-tests

      - name: Upload VS Code extension coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./vscode-extension/coverage/lcov.info
          flags: vscode-extension
          name: vscode-extension-unit-tests

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build e2e Docker image
        run: docker build -t dotenc-e2e -f cli/e2e/Dockerfile .

      - name: Run e2e tests
        run: docker run --rm dotenc-e2e

  cli-image:
    name: CLI image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            target: runtime
            image: dotenc-cli:debian
          - variant: alpine
            target: runtime-alpine
            image: dotenc-cli:alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build CLI image (${{ matrix.variant }})
        run: docker build --target "${{ matrix.target }}" -t "${{ matrix.image }}" -f cli/Dockerfile .

      - name: Verify CLI image (${{ matrix.variant }})
        run: |
          docker run --rm "${{ matrix.image }}" --version
          docker run --rm --entrypoint sh "${{ matrix.image }}" -c '
            set -eu
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            command -v dotenc
            command -v ssh-keygen
            mkdir -p "$HOME/.ssh"
            ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519"
            dotenc init -n image-smoke -k id_ed25519 >/tmp/init.log
            dotenc env create production image-smoke >/tmp/create.log
            printf "IMAGE_SMOKE_OK=yes\n" | dotenc env encrypt --stdin production >/tmp/encrypt.log
            test "$(dotenc env decrypt production)" = "IMAGE_SMOKE_OK=yes"
          '
